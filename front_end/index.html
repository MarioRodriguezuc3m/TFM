<html lang="es">
  <head>
    <title>Pirate Ship Island with JavaScript</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene fog="type: exponential; color: #87CEEB; density: 0.0075;"
         renderer="preserveDrawingBuffer: true"
         role="application"
         tabindex="0"
         aria-label="Escena virtual interactiva. Usa el teclado para explorar.">

      <a-assets>
        <a-asset-item id="barco-pirata-modelo" src="3d-models/pirate_ship.glb"></a-asset-item>
        <a-asset-item id="cofre-tesoro-modelo" src="3d-models/treasure_chest.glb"></a-asset-item>
        <a-asset-item id="palmera-modelo" src="3d-models/palm_tree.glb"></a-asset-item>
        <a-asset-item id="espada-modelo" src="3d-models/miraz_sword.glb"></a-asset-item>
        <a-asset-item id="canon-modelo" src="3d-models/pirate_cannon.glb"></a-asset-item>
        <a-asset-item id="calavera-modelo" src="3d-models/skull_downloadable.glb"></a-asset-item>
        <a-asset-item id="mesa-madera-modelo" src="3d-models/wood_table.glb"></a-asset-item>
        <a-asset-item id="fogata-modelo" src="3d-models/campfire.glb"></a-asset-item>
        <a-asset-item id="arbusto-modelo" src="3d-models/bush.glb"></a-asset-item>
        <a-asset-item id="barril-modelo" src="3d-models/barrel.glb"></a-asset-item>
        <a-asset-item id="cajas-pila-modelo" src="3d-models/boxes_pile.glb"></a-asset-item>
        <a-asset-item id="botella-modelo" src="3d-models/bottle.glb"></a-asset-item>
        
        <img id="tex-arena" src="3d-models/sand.jpg">
        <img id="tex-cesped" src="3d-models/grass.jpg">
        <img id="tex-agua" src="3d-models/sea.jpg">
      </a-assets>

      <a-gltf-model src="#barco-pirata-modelo" 
                    position="-5 5 -40" 
                    rotation="0 90 0" 
                    scale="0.01 0.01 0.01" 
                    data-label="Pirate Ship"
                    data-label-es="Barco pirata"
                    data-desc="Large galleon with dark sails anchored in the sea in the background."></a-gltf-model>

      <!-- Section "table with objects" -->
      <a-entity id="grupo-mesa" 
                position="9.5 0 -5" 
                rotation="0 0 0"
                data-label="Table with objects"
                data-label-es="Mesa con objetos"
                data-desc="Wooden table with a sword and a skull on it."
                data-tipo="grupo">
        
        <a-gltf-model src="#mesa-madera-modelo" 
                      class="obstaculo" data-radio="1.5"
                      position="0 0.5 0" 
                      rotation="0 240 0" 
                      scale="1.7 0.95 0.95"
                      data-sublabel="Wooden table"
                      data-sublabel-es="Mesa de madera"
                      data-subdesc="Sturdy wooden table with dark planks">
        </a-gltf-model>

        <a-gltf-model src="#espada-modelo" 
                      position="-0.55 0.8 1.05" 
                      rotation="0 300 0" 
                      scale="1 1 1"
                      data-sublabel="Sword"
                      data-sublabel-es="Espada"
                      data-subdesc="Medieval sword with metallic hilt">
        </a-gltf-model>

        <a-gltf-model src="#calavera-modelo" 
                      position="0.25 1 -0.75" 
                      rotation="0 270 90" 
                      scale="0.35 0.35 0.35"
                      data-sublabel="Skull"
                      data-sublabel-es="Calavera"
                      data-subdesc="Whitish human skull">
        </a-gltf-model>

      </a-entity>

      <!-- Section "campsite"-->
      <a-entity id="grupo-campamento" 
                position="9 0 -18" 
                rotation="0 0 0"
                data-label="Rest campsite"
                data-label-es="Campamento"
                data-desc="Small campsite with campfire, chest and palm tree."
                data-tipo="grupo">

        <a-gltf-model src="#fogata-modelo" 
                      class="obstaculo" data-radio="0.6"
                      position="0 0 0" 
                      rotation="0 -27.5 0" 
                      scale="0.1 0.1 0.1"
                      data-sublabel="Campfire"
                      data-sublabel-es="Hoguera"
                      data-subdesc="Campfire with flames and burning logs">
        </a-gltf-model>

        <a-gltf-model src="#palmera-modelo" 
                      class="obstaculo" data-radio="0.5"
                      position="1 0 -2" 
                      rotation="0 150 0" 
                      scale="0.03 0.03 0.03"
                      data-sublabel="Palm tree"
                      data-sublabel-es="Palmera"
                      data-subdesc="Tropical palm tree with long fan-shaped leaves">
        </a-gltf-model>

        <a-gltf-model src="#cofre-tesoro-modelo" 
                      class="obstaculo" data-radio="0.6"
                      position="-2 0 0" 
                      rotation="0 -45 0" 
                      scale="0.01 0.01 0.01"
                      data-sublabel="Treasure chest"
                      data-sublabel-es="Cofre del tesoro"
                      data-subdesc="Wooden chest with golden metal fittings">
        </a-gltf-model>

      </a-entity>

      <!-- Section cannon-->
      <a-entity id="grupo-canon"
                position="-11.5 0 -16" 
                rotation="0 0 0"
                data-label="Pirate cannon"
                data-label-es="Cañón pirata"
                data-desc="Pirate cannon with barrel and ammunition."
                data-tipo="grupo">

        <a-gltf-model src="#canon-modelo" 
                      class="obstaculo" data-radio="1.0"
                      position="0 0 0" 
                      rotation="0 -27.5 0" 
                      scale="0.005 0.005 0.005"
                      data-sublabel="Cannon"
                      data-sublabel-es="Cañón"
                      data-subdesc="Black iron cannon pointing at the sea">
        </a-gltf-model>

        <a-gltf-model src="#barril-modelo" 
                      class="obstaculo" data-radio="0.5"
                      position="2.5 0.5 3.5" 
                      rotation="0 0 0" 
                      scale="0.01 0.01 0.01"
                      data-sublabel="Barrel"
                      data-sublabel-es="Barril"
                      data-subdesc="Wooden barrel with metal hoops"> 
        </a-gltf-model>

        <a-entity id="pila-balas" 
                  position="3.5 0 -0.5" 
                  rotation="0 -30 0"
                  data-sublabel="Pile of cannonballs"
                  data-sublabel-es="Pila de balas de cañón"
                  data-subdesc="Several black iron spherical cannonballs stacked">
          <a-sphere position="0 0.15 0" radius="0.15" color="#2c2c2c" roughness="0.7" metalness="0.6"></a-sphere>
          <a-sphere position="0.25 0.15 0.15" radius="0.15" color="#2c2c2c" roughness="0.7" metalness="0.6"></a-sphere>
          <a-sphere position="-0.25 0.15 0.15" radius="0.15" color="#2c2c2c" roughness="0.7" metalness="0.6"></a-sphere>
          <a-sphere position="0 0.38 0.1" radius="0.15" color="#2c2c2c" roughness="0.7" metalness="0.6"></a-sphere>
        </a-entity>

      </a-entity>
      
      <!-- Section "warehouse"-->
      <a-entity id="grupo-almacen"
                position="-4 0 -2"
                rotation="0 20 0"
                data-label="Small supply warehouse"
                data-label-es="Pequeño almacén"
                data-desc="Warehouse with crates, barrels and bottles."
                data-tipo="grupo">

        <a-gltf-model src="#cajas-pila-modelo" 
                      class="obstaculo" data-radio="0.8"
                      position="0 0.4 0" 
                      rotation="0 0 0" 
                      scale="1 1 1"
                      data-sublabel="Pile of crates"
                      data-sublabel-es="Pila de cajas"
                      data-subdesc="Several wooden crates stacked irregularly"> 
        </a-gltf-model>

        <a-gltf-model src="#barril-modelo" 
                      class="obstaculo" data-radio="0.5"
                      position="-1.1 0.5 2" 
                      rotation="0 0 0" 
                      scale="0.01 0.01 0.01"
                      data-sublabel="Vertical barrel"
                      data-sublabel-es="Barril vertical"
                      data-subdesc="Wooden barrel in vertical position">
        </a-gltf-model>
        
        <a-gltf-model src="#barril-modelo" 
                      class="obstaculo" data-radio="0.5"
                      position="1.3 0.3 0.5" 
                      rotation="90 45 0" 
                      scale="0.01 0.01 0.01"
                      data-sublabel="Laid down barrel"
                      data-sublabel-es="Barril tumbado"
                      data-subdesc="Wooden barrel laid down on its side">
        </a-gltf-model>

        <a-gltf-model src="#botella-modelo" 
                      position="-0.9 0.8 0.5" 
                      rotation="0 45 0" 
                      scale="1.3 1.3 1.3"
                      data-sublabel="Bottle"
                      data-sublabel-es="Botella"
                      data-subdesc="Empty glass bottle">
        </a-gltf-model>

        <a-gltf-model src="#botella-modelo" 
                      position="-0.65 1.45 -0.6" 
                      rotation="0 15 0" 
                      scale="1.3 1.3 1.3"
                      data-sublabel="Bottle"
                      data-sublabel-es="Botella"
                      data-subdesc="Empty glass bottle">
        </a-gltf-model>

        <a-gltf-model src="#botella-modelo" 
                      position="0 0.05 0.9" 
                      rotation="90 120 0" 
                      scale="1.3 1.3 1.3"
                      data-sublabel="Bottle"
                      data-sublabel-es="Botella"
                      data-subdesc="Empty glass bottle">
        </a-gltf-model>

      </a-entity>

      <!-- Various decorations (bushes, palm trees, rocks,...) -->
      <a-gltf-model src="#arbusto-modelo" 
                    position="5 0 -4" 
                    rotation="0 0 0" 
                    scale="0.75 0.75 0.75"
                    data-label="Bush"
                    data-label-es="Arbusto"
                    data-desc="Low green bush with round leaves"></a-gltf-model>
      
      <a-gltf-model src="#palmera-modelo" 
                    class="obstaculo" data-radio="0.5" 
                    position="-8 0 -5" 
                    rotation="0 60 0" 
                    scale="0.03 0.03 0.03"
                    data-label="Palm tree"
                    data-label-es="Palmera"
                    data-desc="Tall tropical palm tree with fan-shaped leaves"></a-gltf-model>

      <a-gltf-model src="#palmera-modelo" 
                    class="obstaculo" data-radio="0.5" 
                    position="-14 0 -5" 
                    rotation="0 90 0" 
                    scale="0.025 0.025 0.025"
                    data-label="Palm tree"
                    data-label-es="Palmera"
                    data-desc="Tall tropical palm tree with fan-shaped leaves"></a-gltf-model>

      <a-gltf-model src="#arbusto-modelo" 
                    position="3 0 -1" 
                    rotation="0 0 0" 
                    scale="0.8 0.8 0.8"
                    data-label="Bush"
                    data-label-es="Arbusto"
                    data-desc="Low green bush with round leaves"></a-gltf-model>

      <a-dodecahedron class="obstaculo" data-radio="1" 
                      position="-2 0 -12" 
                      color="#707070" 
                      radius="1" 
                      scale="1.2 0.5 1.2" 
                      rotation="0 45 0" 
                      roughness="1"
                      data-label="Large rock"
                      data-label-es="Roca grande"
                      data-desc="Irregular gray rock of medium size"></a-dodecahedron>

      <a-gltf-model src="#arbusto-modelo" 
                    position="-1 0 -11.5" 
                    rotation="0 180 0" 
                    scale="0.4 0.4 0.4"
                    data-label="Small bush"
                    data-label-es="Arbusto pequeño"
                    data-desc="Small green bush"></a-gltf-model>

      <a-dodecahedron position="12 0 -3" 
                      color="#808080" 
                      radius="0.3" 
                      scale="1 0.5 1" 
                      roughness="1"
                      data-label="Stone"
                      data-label-es="Piedra"
                      data-desc="Small gray stone"></a-dodecahedron>

      <a-dodecahedron position="11.5 0 -3.2" 
                      color="#696969" 
                      radius="0.2" 
                      scale="1 0.4 1" 
                      roughness="1"
                      data-label="Small stone"
                      data-label-es="Piedra pequeña"
                      data-desc="Very small gray stone"></a-dodecahedron>

      <a-gltf-model src="#arbusto-modelo" 
                    position="11 0 -10" 
                    rotation="0 45 0" 
                    scale="0.6 0.6 0.6"
                    data-label="Bush"
                    data-label-es="Arbusto"
                    data-desc="Medium green bush"></a-gltf-model>

      <a-dodecahedron class="obstaculo" data-radio="1.5" 
                      position="0 -0.2 -21" 
                      color="#5c5c5c" 
                      radius="1.5" 
                      scale="1.5 0.6 1" 
                      rotation="0 15 5" 
                      roughness="0.9"
                      data-label="Large rock"
                      data-label-es="Roca grande"
                      data-desc="Large irregular dark gray rock"></a-dodecahedron>

      <a-dodecahedron class="obstaculo" data-radio="1.5" 
                      position="9 -0.2 0" 
                      color="#5c5c5c" 
                      radius="1.5" 
                      scale="1 0.6 1" 
                      rotation="0 75 5" 
                      roughness="0.9"
                      data-label="Rock"
                      data-label-es="Roca"
                      data-desc="Medium dark gray rock"></a-dodecahedron>

      <a-dodecahedron class="obstaculo" data-radio="1" 
                      position="-10 0 0" 
                      color="#707070" 
                      radius="1" 
                      scale="1.2 0.5 1.2" 
                      rotation="0 45 0" 
                      roughness="1"
                      data-label="Rock"
                      data-label-es="Roca"
                      data-desc="Medium gray rock"></a-dodecahedron>
      
      <!-- Floors, sea and sky -->
      <a-plane id="suelo-cesped" 
               src="#tex-cesped"
               position="0 0 -3.75" 
               rotation="-90 0 0" 
               width="30" 
               height="12.5"
               repeat="10 4"
               roughness="1">
      </a-plane>

      <a-plane id="suelo-arena" 
               src="#tex-arena"
               position="0 0 -16.25" 
               rotation="-90 0 0" 
               width="30" 
               height="12.5"
               repeat="10 4"
               roughness="1"> 
      </a-plane>

      <a-circle src="#tex-agua"
               position="0 -0.2 0" 
               rotation="-90 0 0" 
               radius="500" 
               opacity="0.8"
               repeat="50 50">
      </a-circle>

      <a-sky color="#87CEEB"></a-sky>
      <a-entity light="type: ambient; color: #BBB; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 1 1"></a-entity>

      <a-entity id="cameraRig" position="0 0 -10" keyboard-camera-controls boundary-checker>
        <a-camera wasd-controls="enabled: false" look-controls="enabled: false" captura-escena></a-camera>
      </a-entity>

    </a-scene>
    <script src="script.js"></script>
  </body>
</html>
